<!-- @dsCard group="Colors" viewport="700x200" subtitle="Ground, Ground 2, Panel — warm near-black, never cool" name="Ground" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:200px;padding:24px 28px;overflow:hidden;">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;"><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-ground);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Ground</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#15100C · --velour-ground</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Primary background. Warm near-black, never cool.</div></div><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-ground-2);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Ground 2</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#1D1610 · --velour-ground-2</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Gradient partner; panel edges.</div></div><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-panel);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Panel</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#221A13 · --velour-panel</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Cards and boxed content.</div></div></div>
</div>
</body></html>
