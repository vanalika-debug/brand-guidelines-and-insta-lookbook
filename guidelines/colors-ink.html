<!-- @dsCard group="Colors" viewport="700x200" subtitle="Warm ivory text, never pure white" name="Ink" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:200px;padding:24px 28px;overflow:hidden;">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;"><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-ink);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Ink</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#F3E8D6 · --velour-ink</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Primary text on dark. Warm ivory, never pure white.</div></div><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-ink-soft);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Ink Soft</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#C9B89C · --velour-ink-soft</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Body copy, secondary text.</div></div><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-ink-faint);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Ink Faint</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#8A7860 · --velour-ink-faint</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Captions, footers.</div></div></div>
</div>
</body></html>
