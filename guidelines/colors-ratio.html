<!-- @dsCard group="Colors" viewport="700x110" subtitle="Ground 60 · Ink 30 · Gold 10" name="Colour ratio" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:110px;padding:24px 28px;overflow:hidden;">
<div style="display:flex;height:34px;border:1px solid var(--velour-line);">
  <div style="flex:60;background:var(--velour-ground);display:flex;align-items:center;padding-left:12px;"><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-ink-soft);">Ground · 60%</div></div>
  <div style="flex:30;background:var(--velour-ink);display:flex;align-items:center;padding-left:12px;"><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-ground);">Ink · 30%</div></div>
  <div style="flex:10;background:var(--velour-gold);display:flex;align-items:center;padding-left:8px;"><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-ground);">Gold</div></div></div>
  <div style="font-size:12px;color:var(--velour-ink-faint);margin-top:12px;">Every layout keeps roughly this balance. Gold appears as eyebrows, rules, numerals and one italic phrase.</div>
</div>
</body></html>
