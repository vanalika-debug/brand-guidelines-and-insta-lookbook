<!-- @dsCard group="Spacing" viewport="700x300" subtitle="16:9 page: 6.9% side margins, top-aligned, mono footer" name="Deck frame" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:300px;padding:24px 28px;overflow:hidden;">
<div style="display:grid;grid-template-columns:420px 1fr;gap:24px;">
 <div style="position:relative;width:420px;height:236px;background:var(--surface-page-gradient);border:1px solid var(--velour-line);">
  <div style="position:absolute;left:29px;right:29px;top:30px;bottom:30px;border:1px dashed rgba(200,159,91,.35);"></div>
  <div style="position:absolute;left:29px;top:30px;"><div style="font-family:var(--font-mono);font-size:7px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-gold);">Eyebrow</div><div style="font-family:var(--font-display);font-size:20px;color:var(--velour-ink);margin-top:6px;">Headline, <em style="color:var(--velour-gold-bright);">one phrase.</em></div><div style="width:18px;height:1px;background:var(--velour-gold);margin-top:10px;"></div></div>
  <div style="position:absolute;left:29px;right:29px;bottom:11px;display:flex;justify-content:space-between;"><div style="font-family:var(--font-mono);font-size:6px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-ink-faint);">Velour — Deck</div><div style="font-family:var(--font-mono);font-size:6px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-ink-faint);">02 / 14</div></div></div>
 <div><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;"><li style="display:grid;grid-template-columns:14px 1fr;font-size:12px;line-height:1.5;color:var(--velour-ink-soft);"><span style="color:var(--velour-ink-faint);">–</span><span>Side margins 6.9% (132px at 1920).</span></li><li style="display:grid;grid-template-columns:14px 1fr;font-size:12px;line-height:1.5;color:var(--velour-ink-soft);"><span style="color:var(--velour-ink-faint);">–</span><span>Content starts ~13% from the top.</span></li><li style="display:grid;grid-template-columns:14px 1fr;font-size:12px;line-height:1.5;color:var(--velour-ink-soft);"><span style="color:var(--velour-ink-faint);">–</span><span>Footer inset ~4.8% from the bottom.</span></li><li style="display:grid;grid-template-columns:14px 1fr;font-size:12px;line-height:1.5;color:var(--velour-ink-soft);"><span style="color:var(--velour-ink-faint);">–</span><span>Rows of 3 or 4 equal panels, ~52px gaps at 1920.</span></li><li style="display:grid;grid-template-columns:14px 1fr;font-size:12px;line-height:1.5;color:var(--velour-ink-soft);"><span style="color:var(--velour-ink-faint);">–</span><span>Square corners. No shadows.</span></li></ul></div></div>
</div>
</body></html>
