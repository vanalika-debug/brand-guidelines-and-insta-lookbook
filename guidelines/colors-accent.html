<!-- @dsCard group="Colors" viewport="700x190" subtitle="2026 accent: deep teal green, ribbon or lining only" name="Colour of the Year" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:190px;padding:24px 28px;overflow:hidden;">
<div style="display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:stretch;">
  <div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-accent-2026);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">2026 · Deep teal</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#00594C · --velour-accent-2026</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Approved for 2026 only.</div></div>
  <div style="position:relative;background:var(--velour-panel);border:1px solid var(--velour-line);overflow:hidden;">
    <div style="position:absolute;top:0;bottom:0;left:62%;width:22px;background:var(--velour-accent-2026);"></div>
    <div style="position:absolute;left:20px;top:18px;right:42%;"><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-gold);">Ribbon · lining · sticker</div><div style="font-size:12px;line-height:1.5;color:var(--velour-ink-soft);margin-top:10px;">At most ~10% of a layout, and never replacing gold. A past year's accent never carries into a new campaign.</div></div>
  </div></div>
</div>
</body></html>
