<!-- @dsCard group="Colors" viewport="700x200" subtitle="Signature accent — a light, not a fill" name="Gold" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:200px;padding:24px 28px;overflow:hidden;">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;"><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-gold);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Gold</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#C89F5B · --velour-gold</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Signature accent: eyebrows, rules, icons.</div></div><div style="display:flex;flex-direction:column;gap:6px;">
  <div style="height:72px;background:var(--velour-gold-bright);border:1px solid var(--velour-line);"></div>
  <div style="font-family:var(--font-display);font-size:16px;color:var(--velour-ink);margin-top:4px;">Gold Bright</div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);">#E7C884 · --velour-gold-bright</div>
  <div style="font-size:12px;line-height:1.45;color:var(--velour-ink-faint);">Emphasis and italics.</div></div><div style="display:flex;flex-direction:column;justify-content:flex-end;gap:8px;"><div style="font-family:var(--font-display);font-size:22px;line-height:1.15;color:var(--velour-ink);">Gold is <em style="color:var(--velour-gold-bright);">a light, not a fill.</em></div><div style="font-size:12px;line-height:1.5;color:var(--velour-ink-faint);">It never exceeds about 10% of a layout.</div></div></div>
</div>
</body></html>
