<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:150px;padding:24px 28px;overflow:hidden;">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;"><div><div style="height:70px;background:var(--velour-panel);border:1px solid var(--velour-line);"></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);margin-top:10px;">--velour-line · gold 22%</div></div><div><div style="height:70px;background:var(--velour-panel);border:1px solid var(--velour-gold);"></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);margin-top:10px;">active · --velour-gold</div></div><div><div style="height:70px;display:flex;flex-direction:column;justify-content:space-evenly;"><div style="border-bottom:1px solid var(--velour-line-soft);height:1px;"></div><div style="border-bottom:1px solid var(--velour-line-soft);height:1px;"></div><div style="border-bottom:1px solid var(--velour-line-soft);height:1px;"></div></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--velour-gold);margin-top:10px;">rule · ink-soft 14%</div></div></div>
</div>
</body></html>
