<!-- @dsCard group="Imagery" viewport="700x300" subtitle="Night, Green, Blush, Cream — each paired with gold" name="Four colour worlds" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--velour-ground);">
<div style="box-sizing:border-box;width:700px;height:300px;padding:24px 28px;overflow:hidden;">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;"><div style="display:flex;flex-direction:column;gap:8px;"><img src="../assets/menagerie/scene-01.png" alt="Menagerie scene 1" style="display:block;width:100%;aspect-ratio:420/521;object-fit:cover;"><div style="font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-gold);">World 1 · Night</div><div style="font-family:var(--font-display);font-size:15px;color:var(--velour-ink);">Black and gold</div></div><div style="display:flex;flex-direction:column;gap:8px;"><img src="../assets/menagerie/scene-02.png" alt="Menagerie scene 2" style="display:block;width:100%;aspect-ratio:420/521;object-fit:cover;"><div style="font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-gold);">World 2 · Green</div><div style="font-family:var(--font-display);font-size:15px;color:var(--velour-ink);">Green and gold</div></div><div style="display:flex;flex-direction:column;gap:8px;"><img src="../assets/menagerie/scene-19.png" alt="Menagerie scene 19" style="display:block;width:100%;aspect-ratio:420/521;object-fit:cover;"><div style="font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-gold);">World 3 · Blush</div><div style="font-family:var(--font-display);font-size:15px;color:var(--velour-ink);">Pink and gold</div></div><div style="display:flex;flex-direction:column;gap:8px;"><img src="../assets/menagerie/scene-04.png" alt="Menagerie scene 4" style="display:block;width:100%;aspect-ratio:420/521;object-fit:cover;"><div style="font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--velour-gold);">World 4 · Cream</div><div style="font-family:var(--font-display);font-size:15px;color:var(--velour-ink);">Cream and gold</div></div></div>
</div>
</body></html>
