<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="margin:0;background:var(--velour-ground);"><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v !== window && v.Panel && v.Eyebrow && v.Headline) return v; } catch (e) {} } return {}; })();
const { Panel, Stat, PullQuote, DashList, RuleTable, Em } = NS;
function App() { return (
  <div style={{ padding: 24, display: 'flex', flexDirection: 'column', gap: 20 }}>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 14 }}>
      <Panel eyebrow="02 · Belief" title="Make what you'd give your parents." padding={18}>Dark only, never milk.</Panel>
      <Panel eyebrow="03 · Tension" title="The shortcuts hide in the fine print." padding={18}>Bulk beans, hot milling, palm oil.</Panel>
      <Panel eyebrow="04 · Promise" title={<>Short ingredient list. <Em>Long game.</Em></>} padding={18} active>Single-origin chocolate you can read.</Panel>
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1.3fr', gap: 18 }}>
      <Stat value="4,319" label="reviews on velourchocolates.com, and counting." size={30} />
      <Stat value="5.0%" label="returning-customer rate." size={30} />
      <PullQuote cite="Vanalika Dhakre Nagpal" size={16}>"Protecting trust is far more valuable than protecting margins."</PullQuote>
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: '170px 1fr', gap: 18 }}>
      <DashList title="What stays out" items={['Refined sugar', 'Palm oil', 'Maida']} size={12} />
      <RuleTable labelWidth={70} columns={['', 'The industrial shortcut', 'The Velour way']} rows={[['Roast', 'Dark, heavy roast that hides poor beans.', 'A gentle roast that keeps Criollo\'s notes.'], ['Grind', 'Fast, hot milling.', 'Stone-ground slowly and cool, up to three days.']]} />
    </div>
  </div>
); }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
