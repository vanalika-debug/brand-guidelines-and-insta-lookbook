<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="margin:0;background:var(--velour-ground);"><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v !== window && v.Panel && v.Eyebrow && v.Headline) return v; } catch (e) {} } return {}; })();
const { Eyebrow, Headline, Em, GoldRule } = NS;
function App() { return (
  <div style={{ padding: 28, display: 'flex', flexDirection: 'column', gap: 16 }}>
    <Eyebrow>Part 1 · Visual rules</Eyebrow>
    <Headline size="m">Moody dark. <Em>Gold light.</Em> Product brightest.</Headline>
    <GoldRule />
    <div style={{ display: 'flex', gap: 28 }}>
      <Eyebrow>gold</Eyebrow><Eyebrow tone="soft">soft</Eyebrow><Eyebrow tone="faint">faint</Eyebrow>
    </div>
    <Headline size="title">Short ingredient list. <Em>Long game.</Em></Headline>
  </div>
); }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
