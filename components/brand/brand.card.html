<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="margin:0;background:var(--velour-ground);"><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v !== window && v.Panel && v.Eyebrow && v.Headline) return v; } catch (e) {} } return {}; })();
const { Logo, Eyebrow } = NS;
function App() { return (
  <div style={{ padding: 28, display: 'flex', alignItems: 'center', gap: 40 }}>
    <Logo src="../../assets/logo/velour-logo-master.png" width={300} />
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18, alignItems: 'flex-start' }}>
      <Logo src="../../assets/logo/velour-logo-master.png" width={160} />
      <Logo src="../../assets/logo/velour-logo-master.png" width={60} />
      <Eyebrow tone="faint" size={9}>Min width 120px (enforced)</Eyebrow>
    </div>
  </div>
); }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
